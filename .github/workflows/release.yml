name: Release firmware

# 打 tag v*.*.*（如 v3.0.0）→ 构建 ESP-IDF board 固件 → 签名（fail-closed）→
# 发布到 GitHub Releases → 更新 manifest.json（sha256 + signature）。
# 也可手动触发（需要 tag 已存在）。
#
# AW-006 生产路径：ESP-IDF esp32s3 board 构建（Wi-Fi + SPIRAM，test hooks 编译
# 排除）；OTA_SIGNING_KEY 私钥缺失则构建失败（绝不发布无签名固件）；发布前校验
# resolved sdkconfig 无 TEST_HOOKS/QEMU。Arduino PoC（ota-sim）不再参与发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version, e.g. 3.0.0 (tag v<version> must exist on main)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VERSION"

      - uses: espressif/esp-idf-cmake-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3

      - name: Build board firmware (ESP-IDF, test hooks off)
        run: |
          cd firmware
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.board" \
            -DPROJECT_VER="${{ steps.ver.outputs.version }}" build

      - name: Fail closed if test hooks leaked into the build
        run: |
          if grep -q 'CONFIG_AGENT_WIDGET_TEST_HOOKS=y' firmware/sdkconfig; then
            echo "::error::CONFIG_AGENT_WIDGET_TEST_HOOKS is set in a release build — refusing to publish"
            exit 1
          fi
          if grep -q 'CONFIG_AGENT_WIDGET_PLATFORM_QEMU=y' firmware/sdkconfig; then
            echo "::error::QEMU platform leaked into a release build — refusing to publish"
            exit 1
          fi
          echo "sdkconfig gate OK (board, hooks off)"

      - name: Sign firmware (fail-closed on missing key)
        id: sign
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY" || { echo "::error::OTA_SIGNING_KEY secret is not configured — refusing to publish an unsigned firmware"; exit 1; }
          BIN=firmware/build/agent_widget.bin
          test -f "$BIN"
          echo "$OTA_SIGNING_KEY" > /tmp/ota_sign.key
          chmod 600 /tmp/ota_sign.key
          openssl dgst -sha256 -binary "$BIN" > /tmp/digest.bin
          openssl pkeyutl -sign -inkey /tmp/ota_sign.key -pkeyopt digest:sha256 \
            -in /tmp/digest.bin -out /tmp/sig.bin
          SHA256="$(xxd -p -c 256 /tmp/digest.bin)"
          SIG="$(base64 -w0 /tmp/sig.bin)"
          SIZE="$(stat -c%s "$BIN")"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "signed ${SIZE} bytes; sha256=${SHA256:0:16}…"

      - name: Verify signature round-trip
        run: |
          echo "${{ steps.sign.outputs.signature }}" | base64 -d > /tmp/sig.check.bin
          openssl pkeyutl -verify -inkey /tmp/ota_sign.key -pkeyopt digest:sha256 \
            -in /tmp/digest.bin -sigfile /tmp/sig.check.bin
          echo "signature verified OK"

      - name: Create GitHub release and upload asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=firmware/build/agent_widget.bin
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "release exists, uploading asset"
            gh release upload "${{ steps.ver.outputs.tag }}" "$ASSET" --clobber
          else
            gh release create "${{ steps.ver.outputs.tag }}" "$ASSET" \
              --title "${{ steps.ver.outputs.tag }}" \
              --notes "Firmware ${{ steps.ver.outputs.version }} — ESP-IDF board build, sha256 + RSA-2048 signed. Auto-built by GitHub Actions." \
              --target main
          fi
          echo "release_url=https://github.com/agent-widget/agent-widget/releases/tag/${{ steps.ver.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json (integrity metadata)
        run: |
          URL="https://github.com/agent-widget/agent-widget/releases/download/${{ steps.ver.outputs.tag }}/agent_widget.bin"
          python3 ota-sim/update_manifest.py "${{ steps.ver.outputs.version }}" "$URL" \
            "${{ steps.sign.outputs.size }}" firmware/manifest.json \
            "${{ steps.sign.outputs.sha256 }}" "${{ steps.sign.outputs.signature }}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git add firmware/manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(ota): manifest add v${{ steps.ver.outputs.version }} (sha256+signature) [skip ci]"
            git push origin main
            echo "manifest committed"
          fi

      - name: Summary
        run: |
          echo "=== RELEASE READY ==="
          echo "tag:      ${{ steps.ver.outputs.tag }}"
          echo "release:  ${{ steps.release.outputs.release_url }}"
          echo "sha256:   ${{ steps.sign.outputs.sha256 }}"
          echo "device OTA: 固件带 sha256 + RSA 签名，设备验签后安装；PENDING_VERIFY 自检决定 valid/回滚"
