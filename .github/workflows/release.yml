name: Release firmware

# 打 tag v*.*.*（如 v2.0.0）→ 自动构建固件 → 发布到 GitHub Releases → 更新 manifest.json
# 也可手动触发（需要 tag 已存在）。
#
# 构建：arduino-cli 本地编译（esp32 core v3.x + 自定义 OTA 双槽分区表），自包含、可复现。
# 生产 AW-006 将替换 build 步骤为 ESP-IDF（idf.py build），其余发布逻辑不变。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version, e.g. 2.0.0 (tag v<version> must exist on main)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VERSION"

      - name: Cache arduino core (re-runs)
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ runner.os }}-v1

      - name: Install arduino-cli and esp32 core
        run: |
          curl -fsSL https://github.com/arduino/arduino-cli/releases/download/v1.1.1/arduino-cli_1.1.1_Linux_64bit.tar.gz -o /tmp/arduino-cli.tar.gz
          tar xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Build firmware (arduino-cli, custom OTA partitions)
        run: |
          cd ota-sim
          ./build_arduino.sh "${{ steps.ver.outputs.version }}"

      - name: Verify artifact
        run: |
          test -f ota-sim/dist/firmware-v${{ steps.ver.outputs.version }}.bin
          ls -la ota-sim/dist/
          SIZE=$(stat -c%s ota-sim/dist/firmware-v${{ steps.ver.outputs.version }}.bin)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Artifact size: $SIZE"

      - name: Create GitHub release and upload asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ota-sim/dist
          ASSET="firmware-v${{ steps.ver.outputs.version }}.bin"
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "release exists, uploading asset"
            gh release upload "${{ steps.ver.outputs.tag }}" "$ASSET" --clobber
          else
            gh release create "${{ steps.ver.outputs.tag }}" "$ASSET" \
              --title "${{ steps.ver.outputs.tag }}" \
              --notes "Firmware ${{ steps.ver.outputs.version }} — auto-built by GitHub Actions (arduino-cli, esp32 core 3.x, OTA dual-slot partitions)." \
              --target main
          fi
          echo "release_url=https://github.com/agent-widget/agent-widget/releases/tag/${{ steps.ver.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Compute sha256 + sign firmware (AW-006 integrity metadata)
        id: sign
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          BIN="ota-sim/dist/firmware-v${{ steps.ver.outputs.version }}.bin"
          if [[ -z "${OTA_SIGNING_KEY:-}" ]]; then
            echo "::warning::OTA_SIGNING_KEY secret not set — publishing WITHOUT sha256/signature (devices with AW-006 firmware will reject this release)"
            echo "has_sig=false" >> "$GITHUB_OUTPUT"
          else
            umask 077
            KEYFILE="$RUNNER_TEMP/ota_signing_key.pem"
            printf '%s' "$OTA_SIGNING_KEY" > "$KEYFILE"
            OUT=$(./ota-sim/sign_firmware.sh "$BIN" "$KEYFILE")
            echo "$OUT"
            echo "sha256=$(echo "$OUT" | grep '^sha256=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "signature=$(echo "$OUT" | grep '^signature=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "has_sig=true" >> "$GITHUB_OUTPUT"
            rm -f "$KEYFILE"
          fi

      - name: Update manifest.json (sha256 + signature integrity metadata)
        run: |
          SIZE=$(stat -c%s ota-sim/dist/firmware-v${{ steps.ver.outputs.version }}.bin)
          URL="https://github.com/agent-widget/agent-widget/releases/download/${{ steps.ver.outputs.tag }}/firmware-v${{ steps.ver.outputs.version }}.bin"
          if [[ "${{ steps.sign.outputs.has_sig }}" == "true" ]]; then
            python3 ota-sim/update_manifest.py "${{ steps.ver.outputs.version }}" "$URL" "$SIZE" firmware/manifest.json \
              "${{ steps.sign.outputs.sha256 }}" "${{ steps.sign.outputs.signature }}"
          else
            python3 ota-sim/update_manifest.py "${{ steps.ver.outputs.version }}" "$URL" "$SIZE" firmware/manifest.json
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git add firmware/manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(ota): manifest add v${{ steps.ver.outputs.version }} [skip ci]"
            git push origin main
            echo "manifest committed"
          fi

      - name: Summary
        run: |
          echo "=== RELEASE READY ==="
          echo "tag:      ${{ steps.ver.outputs.tag }}"
          echo "release:  ${{ steps.release.outputs.release_url }}"
          echo "device OTA: 设备启动后将自动从 GitHub Releases API 发现此版本并升级"
