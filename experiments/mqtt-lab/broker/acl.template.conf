# agent-widget MQTT lab ACL template — mirrors the production trust model.
#
# This is a TEMPLATE: scripts/gen-acl.sh renders it into broker/state/acl.conf
# and appends one `user <deviceId>` block per fleet device with exactly the
# cohort topics that device may subscribe to (its canary hash bucket + stable).
#
# Users:
#   server            = fleet operator / status + OTA publisher (full lab access)
#   esp32s3-<hex>     = one user PER DEVICE; username == deviceId, so the
#                       pattern ACLs below lock each device to its own topics.

# Fleet operator: publish statuses and OTA notifications, watch device traffic,
# and clear retained state (the demo wipes retained messages between runs).
user server
topic readwrite agents/#
topic readwrite ota/#
topic readwrite device/#

# Any device (global patterns; cohort topics are added per-device below):
#   - read all agent statuses and the OTA broadcast
#   - read its OWN targeted OTA topic (ota/{deviceId})
#   - write only its own telemetry / events / OTA results
#   - read its own telemetry
# Devices are NOT granted generic ota/group/+ access: cohort membership is
# enumerated per device in the generated section below.
pattern read agents/#
pattern read ota/announce
pattern read ota/%u
pattern write device/%u/telemetry
pattern write device/%u/events
pattern write device/%u/ota/result
pattern read device/%u/#
