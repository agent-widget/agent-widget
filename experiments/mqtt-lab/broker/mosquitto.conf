# agent-widget local MQTT lab broker (eclipse-mosquitto 2.x)
#
# Mirrors the future production broker as closely as a local test allows:
#   - TLS listener with a local CA (server-auth only, no client certs)
#   - username/password authentication with per-topic ACLs
#   - persistence + persistent client sessions so QoS1 messages are queued
#     for devices that are offline when a message is sent
#
# LOCAL TEST ONLY: the credentials below are test secrets on a loopback
# port. Never reuse this configuration for anything reachable.
#
# Topics (see sim/common.py):
#   agents/{agentId}/status     server -> devices, retained, QoS1
#   ota/announce                broadcast OTA notification, retained, QoS1
#   ota/{deviceId}              targeted OTA notification, QoS1
#   ota/group/{group}           staged OTA notification (canary-N/stable/beta), QoS1
#   device/{deviceId}/telemetry devices -> server, retained (last known), QoS1
#   device/{deviceId}/events    device lifecycle/OTA event log, QoS1
#   device/{deviceId}/ota/result last OTA outcome per device, retained, QoS1

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------

# 1883: plaintext MQTT for local/LAN testing
listener 1883 0.0.0.0

# 8883: TLS MQTT (production-like path). Certificates generated by
# broker/scripts/gen-certs.sh into broker/certs/.
listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key

# 9001: WebSocket for browser-based debugging (MQTT.js, MQTTX, hivemq websocket)
listener 9001 0.0.0.0
protocol websockets

# ---------------------------------------------------------------------------
# Authentication and authorization
# ---------------------------------------------------------------------------

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ---------------------------------------------------------------------------
# Persistence and offline queueing
# ---------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/

# Persistent sessions survive broker restarts and keep queuing QoS1 messages
# for a device that has been offline for up to 7 days.
persistent_client_expiration 7d
max_queued_messages 1000
queue_qos0_messages false
max_inflight_messages 20

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
